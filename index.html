<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="description" content="A quiet writing space that remembers your pages for the life of the browser tab.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>noword. / 无言.</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=2">
  <script defer src="./vendor/markdown-it.min.js"></script>
  <script defer src="./app.js?v=2"></script>
</head>
<body>
  <header id="controls" class="controls" hidden>
    <button class="corner-button pages-button" id="pages-button" type="button" aria-label="Pages" aria-expanded="false" aria-controls="pages-panel" title="Pages">
      <img src="./icon.svg" width="24" height="24" alt="">
    </button>
    <section class="panel pages-panel" id="pages-panel" aria-labelledby="pages-heading" hidden>
      <h2 id="pages-heading">Pages</h2>
      <ul id="page-list" class="page-list"></ul>
      <button id="new-page" type="button">New page</button>
    </section>

    <button class="corner-button options-button" id="options-button" type="button" aria-label="Options" aria-expanded="false" aria-controls="options-panel" title="Options">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="currentColor">
        <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
      </svg>
    </button>
    <section class="panel options-panel" id="options-panel" aria-labelledby="options-heading" hidden>
      <h2 id="options-heading">Options</h2>
      <button id="theme" type="button">Switch theme</button>
      <button id="preview" type="button" hidden>Markdown preview</button>
      <p id="session-details">Pages stay in this browser tab and survive refreshes. Closing the tab normally ends the session.</p>
    </section>
  </header>

  <main class="workspace" aria-label="Writing workspace">
    <textarea id="editor" aria-label="Write your draft" placeholder=" " autocomplete="off" autocorrect="off" spellcheck="false" dir="auto"></textarea>
    <h1 class="wordmark"><span>noword.</span><span class="slash">/</span><span lang="zh-Hans">无言.</span></h1>
    <span class="empty-caret" aria-hidden="true"></span>
    <article class="preview-area" id="preview-pane" aria-label="Markdown preview" dir="auto" hidden></article>
  </main>

  <footer id="status-bar" class="status-bar" hidden>
    <span id="session-status" role="status"></span>
    <span id="counts">0 words · 0 characters</span>
  </footer>
  <noscript><p class="no-script">Enable JavaScript to keep your draft through refreshes.</p></noscript>
</body>
</html>
