<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A quiet writing space that remembers your draft for the life of the browser tab.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>noword. / 无言</title>
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./vendor/markdown-it.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark">
      <span class="mark" aria-hidden="true"></span>
      <span>noword.</span>
      <span class="wordmark-divider">/</span>
      <span class="wordmark-chinese" lang="zh-Hans">无言</span>
    </h1>
    <div class="header-actions">
      <button class="focus-button" type="button" id="focus" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5m0 6v5h-5m-6 0H4v-5"/></svg>
        <span id="focus-label">Focus</span>
      </button>
      <button class="theme-button" type="button" id="theme" aria-label="Toggle theme" hidden>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.3A8.7 8.7 0 0 1 8.7 3.5 8.8 8.8 0 1 0 20.5 15.3Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="workspace" aria-label="Writing workspace">
    <div class="toolbar">
      <span class="draft-label">Your draft</span>
      <div class="mode-switch" id="mode-switch" role="group" aria-label="Editor view" hidden>
        <button type="button" id="write" aria-pressed="true" aria-controls="editor">Write</button>
        <button type="button" id="preview" aria-pressed="false" aria-controls="preview-pane" title="Preview Markdown">Preview</button>
      </div>
    </div>

    <div class="paper">
      <div class="writing-area" id="writing-area">
        <textarea id="editor" aria-label="Your draft" placeholder=" " autocomplete="off" autocorrect="off" spellcheck="false" dir="auto"></textarea>
        <span class="writing-prompt" aria-hidden="true">Start writing…</span>
      </div>
      <div class="preview-area" id="preview-pane" role="region" aria-label="Markdown preview" dir="auto" hidden></div>
    </div>

    <footer class="status-bar" id="status-bar" hidden>
      <details class="session">
        <summary>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v1"/></svg>
          <span id="session-status" role="status">Draft stays in this tab</span>
        </summary>
        <p id="session-details">Your browser keeps this draft for the tab session, including refreshes. Closing the tab normally ends the session. There’s no account, upload, or saved file.</p>
      </details>
      <p id="word-count">0 words</p>
    </footer>
    <noscript><p class="no-script">Enable JavaScript to keep your draft through refreshes and preview Markdown.</p></noscript>
  </main>
</body>
</html>
